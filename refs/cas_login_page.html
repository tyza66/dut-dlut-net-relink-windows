<script>

function generateUUID() {
  return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, function(c) {
    // 生成随机数并按 UUID 规则处理
    const r = Math.random() * 16 | 0;
    return r.toString(16);
  });
}


function chooseAppScanAccount(jsonObj) {
	var choose_content = "";
	//var jsonObj = $.parseJSON(data);
	for (let key in jsonObj) {
	    if (jsonObj.hasOwnProperty(key)) {
	        if(key != 'haveUsers'){
		        choose_content += "<li class=\"popup-select-item\" name='choose_user'><div class='user-number' name='id_number' >"+key+"</li>";
	        }
	    }
	}
	
	//id为accountContent的标签下添加choose_content
	$("#accountContent").html(choose_content);
	$("#choose_id").show();
	$("#choose_close").click(function(){
		// 关闭选择账号的open弹出框
		$("#accountContent").html("");
		$("#choose_id").hide();
	})
	$("li[name='choose_user']").click(function(){
		var idnumber = $(this).find("div[name='id_number']").text();
		layer.confirm('确认登录账号[' + idnumber + ']？', {
			title:"登录确认",
			time: 0 //不自动关闭
			,btn: ['确认', '取消']
			,yes: function(index){
				layer.close(index);
				document.cookie = "CASTGC="+jsonObj[idnumber] ;
				$.get("/cas/cb?method=logger" , function(data){
					location.reload();
			  	})
				// 关闭选择账号的open弹出框
				$("#accountContent").html("");
				$("#choose_id").hide();
			}
		});
	})
}

function fresh(uuid){
	let count = 0;
	const intervalId = setInterval(() => {
	  count++;
	  if (count >= 60*2) {
	    clearInterval(intervalId); //2分钟失效
	    $("#div_appqrcode_timeout").show();
	  }else{
		  $.get("/cas/cb?method=refresh&uuid="+uuid , function(data){
			  if(data != null & data.haveUsers == "1"){
				  clearInterval(intervalId); 
				  chooseAppScanAccount(data);
			  }else if(data.info != null && data.info.indexOf("TGT-")!=-1){
				  clearInterval(intervalId); 
					document.cookie = "CASTGC="+data.info ;
					$.get("/cas/cb?method=logger" , function(data){
						location.reload();
				  	})
			  }else{
				  clearInterval(intervalId); 
					location.href = "/cas/reg.html";
			  }
		  })
	  }
	}, 1500);
}
